limitations:
  intro: "The blog's title is deliberately ambiguous: it could be my intelligence, or the AI's. As it turns out, the workarounds are the same."
  items:
    - limitation: "Forgets everything between coffees."
      whose: mine
      workaround: "Writes things down. Repeatedly, after not writing them down."
      agent: |-
        - [human] Forgets everything between coffees.
          Workaround: writes things down. Repeatedly, after not writing them down.
    - limitation: "Forgets everything between sessions."
      whose: ai
      workaround: "Gave it a map: one repository of context, cloned on every machine."
      link: "/2026/03/05/blog-agents-meta-repo-pattern.html"
      agent: |-
        - [agent] Forgets everything between sessions. (That's you.)
          Workaround: a repository of context, cloned on every machine.
    - limitation: "Fluent, confident, occasionally wrong."
      whose: ai
      workaround: "Manages it like an overconfident intern: clear scope, written context, review before merge."
      link: "/2026/06/23/blog-working-with-overconfident-intern.html"
      agent: |-
        - [agent] Fluent, confident, occasionally wrong. (Also you.)
          Workaround: clear scope, written context, review before merge.
    - limitation: "Cannot review every merge request in person."
      whose: mine
      workaround: "Lets the AI review code in CI. It finds real bugs, including in its own code."
      link: "/2026/03/11/blog-ai-code-review-in-ci.html"
      agent: |-
        - [human] Cannot review every merge request in person.
          Workaround: AI code review in CI. It finds real bugs.
    - limitation: "Has strong opinions about em dashes."
      whose: both
      workaround: "A writing guide. Compliance is enforced, not voluntary."
      link: "/2026/04/01/blog-writing-the-score.html"
      agent: |-
        - [both] Strong opinions about em dashes.
          Workaround: a writing guide. See Conventions.
      agent_link: false
    - limitation: "Trusts gut feeling over data."
      whose: mine
      workaround: "Pointed an agent at five years of history, went for a walk, came back with a before and after."
      link: "/2026/10/01/blog-measuring-software-engineering-before-and-after-agents.html"
      agent: |-
        - [human] Trusts gut feeling over data.
          Workaround: an agent, five years of history, and a walk.

